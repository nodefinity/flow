<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Flow FM dot-matrix wordmark</title>
  <desc id="desc">A full dot-matrix Flow wordmark with a w shaped to hint at FM.</desc>
  <defs>
    <pattern id="flow-dot-v3" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="4.8" fill="#101010" />
    </pattern>
    <mask id="flow-word-mask-v3" maskUnits="userSpaceOnUse">
      <rect width="1280" height="360" fill="#000000" />

      <rect x="82" y="62" width="58" height="236" rx="29" fill="#ffffff" />
      <rect x="82" y="62" width="206" height="58" rx="29" fill="#ffffff" />
      <rect x="82" y="158" width="164" height="58" rx="29" fill="#ffffff" />

      <rect x="320" y="62" width="58" height="236" rx="29" fill="#ffffff" />

      <circle cx="514" cy="198" r="102" fill="#ffffff" />
      <circle cx="514" cy="198" r="43" fill="#000000" />

      <path
        d="M688 128 L752 296 L824 170 L894 296 L966 170 L1038 296"
        stroke="#ffffff"
        stroke-width="62"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <rect x="54" y="38" width="1040" height="286" fill="url(#flow-dot-v3)" mask="url(#flow-word-mask-v3)" />

  <g aria-hidden="true">
    <circle cx="470" cy="198" r="5.8" fill="#5ee0ad" />
    <circle cx="492" cy="198" r="5.8" fill="#5ee0ad" />
    <circle cx="514" cy="198" r="5.8" fill="#5ee0ad" />
    <circle cx="536" cy="198" r="5.8" fill="#5ee0ad" />
    <circle cx="558" cy="198" r="5.8" fill="#5ee0ad" />
  </g>
</svg>
