<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flow aligned dot-matrix wordmark</title>
  <desc id="desc">An optically aligned Flow wordmark with a dot-matrix radio o and solid geometric letters.</desc>
  <defs>
    <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="4.6" fill="#101010" />
    </pattern>
    <mask id="o-ring-mask" maskUnits="userSpaceOnUse">
      <rect width="1200" height="360" fill="#000000" />
      <circle cx="486" cy="200" r="92" fill="#ffffff" />
      <circle cx="486" cy="200" r="43" fill="#000000" />
    </mask>
  </defs>

  <g fill="none">
    <g fill="#101010">
      <rect x="82" y="70" width="56" height="220" rx="28" />
      <rect x="82" y="70" width="190" height="56" rx="28" />
      <rect x="82" y="160" width="150" height="54" rx="27" />
      <rect x="304" y="70" width="56" height="220" rx="28" />
    </g>

    <rect x="384" y="98" width="204" height="204" fill="url(#dot-grid)" mask="url(#o-ring-mask)" />

    <g aria-hidden="true">
      <circle cx="442" cy="200" r="6" fill="#5ee0ad" />
      <circle cx="464" cy="200" r="6" fill="#5ee0ad" />
      <circle cx="486" cy="200" r="6" fill="#ff6254" />
      <circle cx="508" cy="200" r="6" fill="#5ee0ad" />
      <circle cx="530" cy="200" r="6" fill="#5ee0ad" />
    </g>

    <path
      d="M650 136 L708 262 L774 154 L840 262 L906 154 L972 262"
      stroke="#101010"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
