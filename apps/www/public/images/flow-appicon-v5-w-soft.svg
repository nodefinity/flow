<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Flow app icon soft W</title>
  <desc id="desc">A softer Flow app icon with a wider flowing dot-matrix W mark.</desc>
  <defs>
    <pattern id="w-bg-dot-v5-soft" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3.2" fill="#16c7df" opacity="0.13" />
    </pattern>
    <pattern id="w-letter-dot-v5-soft" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="9.7" fill="#101010" />
    </pattern>
    <mask id="w-soft-mask-v5" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="#000000" />
      <path
        d="M150 428 C236 736 334 748 410 484 C470 278 560 278 622 484 C704 748 814 736 874 428"
        fill="none"
        stroke="#ffffff"
        stroke-width="136"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#fffaf1" />
  <rect width="1024" height="1024" rx="220" fill="url(#w-bg-dot-v5-soft)" />
  <rect x="110" y="118" width="804" height="788" rx="184" fill="#fffdf7" opacity="0.72" />
  <rect x="82" y="172" width="878" height="696" fill="url(#w-letter-dot-v5-soft)" mask="url(#w-soft-mask-v5)" />

  <g aria-hidden="true">
    <circle cx="466" cy="508" r="14" fill="#5ee0ad" />
    <circle cx="512" cy="508" r="14" fill="#5ee0ad" />
    <circle cx="558" cy="508" r="14" fill="#5ee0ad" />
  </g>
</svg>
