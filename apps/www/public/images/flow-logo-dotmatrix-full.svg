<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flow full dot-matrix wordmark</title>
  <desc id="desc">A Flow wordmark where every letter is built from radio dot-matrix points.</desc>
  <defs>
    <pattern id="letter-dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="5" fill="#101010" />
    </pattern>
    <mask id="flow-letter-mask" maskUnits="userSpaceOnUse">
      <rect width="1200" height="360" fill="#000000" />
      <rect x="72" y="62" width="58" height="236" rx="29" fill="#ffffff" />
      <rect x="72" y="62" width="184" height="58" rx="29" fill="#ffffff" />
      <rect x="72" y="154" width="154" height="58" rx="29" fill="#ffffff" />
      <rect x="292" y="62" width="58" height="236" rx="29" fill="#ffffff" />
      <circle cx="478" cy="180" r="108" fill="#ffffff" />
      <path
        d="M658 142 L714 296 L784 176 L852 296 L922 176 L988 296"
        stroke="#ffffff"
        stroke-width="58"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <rect x="42" y="36" width="1032" height="288" fill="url(#letter-dot-grid)" mask="url(#flow-letter-mask)" />

  <g aria-hidden="true">
    <circle cx="434" cy="178" r="5.4" fill="#5ee0ad" />
    <circle cx="454" cy="178" r="5.4" fill="#5ee0ad" />
    <circle cx="474" cy="178" r="5.4" fill="#5ee0ad" />
    <circle cx="494" cy="178" r="5.4" fill="#ff6254" />
    <circle cx="514" cy="178" r="5.4" fill="#5ee0ad" />
    <circle cx="534" cy="178" r="5.4" fill="#5ee0ad" />
  </g>
</svg>
